<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React</title>
    <style>
      
     
      #startup-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: black; /* match your theme */
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      .spinnerLogo {
        width: 50px; /* adjust size */
        height: 50px;
        background-image: url('/images/speakParrow.png');
        background-size: cover;
        background-position: center;
        border-radius: 12px;
        animation: parrotFlip 2s infinite;
      }

      @keyframes parrotFlip {
        0% {
          transform: rotateY(0deg);
        }
        50% {
          transform: rotateY(180deg);
        }
        100% {
          transform: rotateY(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="startup-loader">
      <div class=" flex flex-col justify-center items-center">
        <div class="spinnerLogo"></div>
        <div class="text-white">SpeakParrow</div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
